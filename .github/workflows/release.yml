# 云构建 + 自动发版：Windows 打包 → 签名 → GitHub Release（latest.json + 安装包）
# 用法：Actions → Release Desktop App → Run workflow → 输入版本号（如 0.1.1）
# 前提：仓库 Secrets 里配置
#   TAURI_SIGNING_PRIVATE_KEY     私钥全文（src-tauri/updater.key 的内容）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  私钥密码
# 注意：每次发版用固定文件名 latest.json（最新 Release 同名资产覆盖），
# 客户端 endpoint 无需改动；安装包文件名含版本号，与 latest.json 内 url 对应。

name: Release Desktop App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（会覆盖 tauri.conf.json 的 version 并用 vX.Y.Z 打 tag）"
        required: true
        default: "0.1.1"

env:
  VERSION: ${{ github.event.inputs.version }}

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & sign Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Write version
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = "$env:VERSION"
          $conf | ConvertTo-Json -Depth 32 | Set-Content src-tauri/tauri.conf.json -Encoding utf8

      - name: Build (NSIS installer + updater artifacts)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis

      - name: Locate installer & sign
        shell: pwsh
        run: |
          Write-Output "==> bundle 目录内容："
          Get-ChildItem -Recurse "src-tauri\target\release\bundle" -ErrorAction SilentlyContinue |
            Select-Object FullName, Length | Format-Table -AutoSize
          $exe = Get-ChildItem -Recurse "src-tauri\target\release\bundle" -Filter *.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'setup' -and $_.Name -notmatch 'uninst' } |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "未找到 NSIS 安装包产物（见上方 bundle 目录内容）" }
          Write-Output "EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          npx tauri signer sign -f $exe.FullName

      - name: Generate latest.json
        shell: pwsh
        run: |
          $version = "$env:VERSION"
          $exeName = Split-Path $env:EXE -Leaf
          $sig = (Get-Content ($env:EXE + ".sig") -Raw).Trim()
          $manifest = @{
            version = $version
            notes   = "Axiom Logic $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig
                url = "https://github.com/HITM1ss/Latex-recognition/releases/latest/download/$exeName"
              }
            }
          } | ConvertTo-Json -Depth 6
          Set-Content latest.json $manifest -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          body: |
            Axiom Logic ${{ env.VERSION }}
          files: |
            ${{ env.EXE }}
            ${{ github.workspace }}/latest.json